[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
autoagents = {version = "0.3.4", features = ["deepseek", "openrouter"]}
autoagents-derive = "0.3.4"
axum = {version = "0.8.8", features = ["tokio"]}
diesel = {version = "2.3.6", features = ["postgres", "uuid", "serde_json", "chrono"]}
chrono = {version = "0.4.42", features = ["serde"]}
serde = "1.0.228"
serde_json = "1.0.149"
tokio = {version = "1.49.0", features = ["rt-multi-thread", "macros"]}
uuid = "1.21.0"
