[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
diesel = { version = "2.3.6", features = ["postgres", "r2d2", "chrono", "uuid", "serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
thiserror = "2.0.18"
diesel-derive-enum = {version = "2.1.0", features = ["postgres"]}
autoagents = "0.3.6"
autoagents-derive = "0.3.6"
