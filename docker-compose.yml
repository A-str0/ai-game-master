services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-game-master-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_game_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: core/api/Dockerfile
    container_name: ai-game-master-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_game_master
    ports:
      - "3000:3000"

volumes:
  postgres_data:
